# Builds the game on GitHub's runners, then deploys it to the Dell through the
# self-hosted runner there. The Dell never builds (low RAM, shared box): it only
# syncs files, installs the sensor's dependencies and restarts the service.
# One-time Dell setup: deploy/SETUP.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install game dependencies
        working-directory: game
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: game
        run: npm test

      - name: Build (typecheck + vite build)
        run: npm run build

      # index.mjs imports the PEARL market (market.mjs and its modules) lazily, so a
      # syntax error there would only show up as a 503 at runtime: check them all here.
      - name: Check sensor syntax
        run: |
          node --check sensor/index.mjs
          node --check sensor/static.mjs
          node --check sensor/frames.mjs
          node --check sensor/decode.mjs
          node --check sensor/market.mjs
          node --check sensor/market-rules.mjs
          node --check sensor/fish-market.mjs
          node --check sensor/market-program-mode.mjs
          node --check sensor/market-server-mode.mjs
          node --check sensor/pearl-png.mjs
          node --check sensor/nft-meta.mjs
          node --check sensor/nft-serial.mjs
          node --check sensor/fish-png.mjs
          node --check sensor/market-sale.mjs
          node --check sensor/market-payout.mjs
          node --check sensor/fish-gen.mjs
          node --check sensor/fish-trust.mjs
          node --check sensor/fish-collection.mjs
          node --check sensor/market-balance.mjs

      # deploy.sh runs on the Dell, where a broken script means a broken site: test its
      # backup, health checks and rollback here first (fakes for sudo, curl and npm).
      - name: Test deploy script
        run: |
          bash -n deploy/deploy.sh
          if command -v shellcheck >/dev/null; then shellcheck -S warning deploy/deploy.sh deploy/test-deploy.sh; fi
          bash deploy/test-deploy.sh

      - uses: actions/upload-artifact@v4
        with:
          name: game-dist
          path: game/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, dell]
    timeout-minutes: 20
    concurrency:
      group: deploy-dell
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: game/dist

      - name: Sync, install, restart, health check
        env:
          DEPLOY_DIR: /srv/breathless/app
          # Repository variable HEALTH_MARKET=0 skips the /api/market/info check
          # (Settings → Secrets and variables → Actions → Variables), without a push.
          HEALTH_MARKET: ${{ vars.HEALTH_MARKET || '1' }}
        run: bash deploy/deploy.sh
