# Hourly health check of production (https://breathless.gotclass.xyz): the game page, the PEARL
# market's info, the market wallet's SOL and PEARL mint authority on devnet, the fish collection,
# the NFT metadata and image routes, and the cron route. Logic and thresholds:
# scripts/health-check.mjs; docs: deploy/VERCEL.md ("Health check"). Public endpoints and the
# public devnet RPC only: no secrets.
#
# On a problem it opens ONE issue labelled `health`, assigned to Bowen1314 (GitHub emails the
# assignee); it comments when the set of failing checks changes, at most every 6 h otherwise, and
# comments and closes the issue on recovery. The run itself stays green unless the script breaks.
#
# NOTE: GitHub disables scheduled workflows in a public repository after 60 days without repository
# activity. If the hourly runs stop, re-enable the workflow in the Actions tab (or push a commit).
# Run it by hand with "Run workflow" (workflow_dispatch).
name: Health

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print the checks; do not open, comment on or close issues
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check production
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/health-check.mjs --dry-run="$DRY_RUN"
