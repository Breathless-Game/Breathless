# Not a full config. The Dell's cloudflared already runs a named tunnel from
# /etc/cloudflared/config.yml. Back that file up, then add the ONE rule below
# inside its existing `ingress:` list, above the final catch-all
# (`- service: http_status:404`). Leave every other rule alone.
#
# WebSockets pass through the tunnel automatically: the game's
# wss://<hostname>/sensor needs no extra setting.
ingress:
  - hostname: game.example.com # your hostname
    service: http://127.0.0.1:8794
  # ... the existing rules stay here, unchanged ...
  - service: http_status:404
