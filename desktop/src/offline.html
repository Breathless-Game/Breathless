<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>屏息 Breathless</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 30%, #0c345c 0%, #030c1e 70%);
        color: #e6f4ff;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        text-align: center;
      }
      main { max-width: 440px; padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 24px; font-weight: 800; }
      p { margin: 0 0 4px; color: #a9c7e0; }
      #reason { margin-top: 12px; font-size: 13px; color: #6f8fa8; word-break: break-word; }
      button {
        margin-top: 24px;
        padding: 10px 28px;
        border: 0;
        border-radius: 999px;
        background: #40c8ff;
        color: #03182c;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #7fdcff; }
      button:disabled { opacity: 0.6; cursor: default; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach the server</h1>
      <p>无法连接服务器</p>
      <p>Breathless needs the internet. Check your connection, then retry.<br />屏息需要联网。请检查网络后重试。</p>
      <div id="reason"></div>
      <button id="retry" type="button">Retry · 重试</button>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
