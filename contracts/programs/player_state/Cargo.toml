[package]
name = "player_state"
version = "0.1.0"
description = "Breathless player state: per-wallet equipment, synthesis and aquarium progress, paid for by burning PEARL"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "player_state"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.2" }
anchor-spl = { version = "=0.31.2", features = ["token", "token_2022"] }
