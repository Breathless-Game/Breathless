[toolchain]
anchor_version = "0.31.2"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
fish_market = "5HEuVNCHKjpfnsdJzov3zDy9UFSj8V2tzF8L9eQnKsDG"

[programs.devnet]
fish_market = "5HEuVNCHKjpfnsdJzov3zDy9UFSj8V2tzF8L9eQnKsDG"

[provider]
cluster = "localnet"
wallet = ".keys/deployer.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 20000

# Port 8899 is taken by the game's sensor server (sensor/index.mjs), so the
# local test validator listens on 8999 instead.
# bind_address: Agave 4.x refuses Anchor 0.31's default of 0.0.0.0 for gossip.
[test.validator]
bind_address = "127.0.0.1"
rpc_port = 8999
faucet_port = 9990

# Programs the tests need, dumped from devnet by `npm run fixtures`.
[[test.genesis]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
program = "tests/fixtures/mpl_core.so"

[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
program = "tests/fixtures/mpl_token_metadata.so"
